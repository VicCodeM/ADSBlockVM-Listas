# Cada hora: pregunta a cada autor si su lista cambió y actualiza solo esas copias (y los paquetes que las usan).
# Si nada cambió, no hay commit. El convertidor es el mismo lector de reglas del motor de ADSBlockVM.
name: Actualizar listas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-listas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Bajar el convertidor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download convertidor --pattern adsblockvm-listas --dir . --clobber
          chmod +x adsblockvm-listas

      - name: Convertir lo que cambió
        run: ./adsblockvm-listas .

      - name: Publicar si algo cambió
        # Solo se guarda la versión más reciente (un único commit, reemplazado cada vez): las listas grandes cambian
        # a diario y con historial el repositorio crecería varios GB en semanas. Las direcciones de descarga no cambian.
        run: |
          rm -f adsblockvm-listas
          git config user.name "ADSBlockVM"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git checkout -q --orphan nueva
          git commit -q -m "Listas al dia $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push --force origin nueva:main
